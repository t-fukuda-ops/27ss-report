<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>27SS トルソー別コーデ採用</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 社内の展示会振り返り。静かで実務的、数字が主役
   IDEA: 展示会場のトルソー並び＝見本帳。月・訴求ごとの棚
   PICTURE: トルソー写真そのもの。カードの上半分
   COLOUR and TYPE: 生成りの床色 + 白カード、緑=採用、赤=弱い。Noto Sans JP
   LAYOUT: 添付レポート準拠の4列カード、下に店舗×トルソー表 */
:root{color-scheme:light dark;--bg:light-dark(#efebe5,#1c1a17);--card:light-dark(#fff,#272420);--tile:light-dark(#f3efe9,#322e29);--ink:light-dark(#1f2328,#ece7df);--mut:light-dark(#6b6f75,#a59f96);--line:light-dark(#e6e1d9,#3a352f);--ok:light-dark(#1e7a46,#6fcf97);--okb:light-dark(#dff1e6,#1f3a2a);--ng:light-dark(#c0392b,#ff8a7a);--ngb:light-dark(#fbe3df,#43231f);--hd:light-dark(#2b3a4a,#cfd8e3)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans JP",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:1400px;margin:0 auto;padding:clamp(20px,3vw,40px) max(3vw,14px)}
h1{font-size:clamp(24px,3vw,34px);line-height:1.15;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--mut);margin:0 0 18px;max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:22px}
.kpi{background:var(--card);border-radius:12px;padding:12px 14px}.kpi b{display:block;font-size:24px}.kpi span{color:var(--mut);font-size:13px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.nav a{background:var(--card);color:var(--ink);text-decoration:none;border-radius:999px;padding:8px 14px;font-size:13px;min-height:36px}
.sec{margin:0 0 34px}.sh{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.sh h2{margin:0;font-size:19px;color:var(--hd)}.sh span{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px;max-width:1340px}
.card{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/5;background:#b9b6b1}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.bd{padding:14px 16px 12px}.tt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.tt b{font-size:16px}.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.good{background:var(--okb);color:var(--ok)}.weak{background:var(--ngb);color:var(--ng)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tl{background:var(--tile);border-radius:8px;padding:6px 10px}
.tl span{display:block;font-size:12px;color:var(--mut)}.tl b{font-size:19px;white-space:nowrap}
.meta{color:var(--mut);font-size:13px;margin:8px 0 6px}.note{color:var(--ng);font-size:12px;margin:-2px 0 6px}
.strip{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;margin:4px 0 4px}
.strip i{display:block;font-style:normal;font-size:10px;text-align:center;border-radius:3px;padding:3px 0;line-height:1.2;color:var(--ink)}
.legend{font-size:11px;color:var(--mut);margin-bottom:6px}
.it{border-top:1px dashed var(--line);padding:7px 0}.r1,.r2{display:flex;justify-content:space-between;gap:8px}
.r1 .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.r1 .v{font-weight:700;white-space:nowrap}
.r2{font-size:12px;color:var(--mut)}.r2 .s{white-space:nowrap}.low{color:var(--ng)!important}.cn{font-size:11px;color:var(--ng)}
table{border-collapse:collapse;width:100%;background:var(--card);border-radius:12px;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{font-weight:500;color:var(--mut)}.scroll{overflow-x:auto;border-radius:12px}
.foot{color:var(--mut);font-size:12px;margin-top:20px;max-width:90ch}
@media(max-width:600px){.strip i{font-size:9px}}
</style></head><body><div class="wrap">
