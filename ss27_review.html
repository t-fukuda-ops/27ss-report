.up{color:var(--ok)}.dn{color:var(--warn)}

.sec{margin:0 0 26px}.sec>p{color:var(--mut);margin:0 0 10px;font-size:13px}

.mix{font-size:12px;color:var(--mut)}.mix b{color:var(--ink);font-weight:500}
